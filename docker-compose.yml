services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  marker_service:
    build:
      context: ./python/marker_service
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      - redis
      - qdrant

volumes:
  qdrant_storage:
