name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  marker-service-check:
    name: Marker service check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate marker service syntax
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m compileall python/marker_service
